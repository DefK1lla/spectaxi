packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  prisma: true
# Tamagui 3.2.x свежее default minimumReleaseAge — иначе pnpm режет install.
minimumReleaseAgeExclude:
  - tamagui
  - "@tamagui/*"
neverBuiltDependencies:
  - "@scarf/scarf"
